name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # Her gün 00:00 UTC
  workflow_dispatch:       # Manuel çalıştırma
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Açık ve koyu tema için "dark energy" paletinde snake SVG'leri üret
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0B6E82&color_dots=#E3F2F6,#A9DDE8,#5CC3D7,#1D97B0,#0B6E82&color_dot_border=#00000010
            dist/github-contribution-grid-snake-dark.svg?color_snake=#5CE1F0&color_dots=#0A1A22,#0E3A4A,#16627A,#2BA3BD,#5CE1F0&color_dot_border=#ffffff08

      # Üretilen SVG'leri output branch'ine yükle (eski Node 20 action'ları yerine düz git)
      - name: Push to output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update snake animation"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
